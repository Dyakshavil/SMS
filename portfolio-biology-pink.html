      overflow-x: hidden;

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1218; }
    ::-webkit-scrollbar-thumb { background: #3d2a35; border-radius: 3px; }

    /* Noise overlay - teal tinted */
    .noise {

      mix-blend-mode: overlay;
    }

    /* Scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(60px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(2deg); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      33% { transform: translateY(-15px) translateX(8px); }
      66% { transform: translateY(-8px) translateX(-5px); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes wavy-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dna-spin {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-50px) rotate(360deg); }
    }
    @keyframes blob-move {
      0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: translate(0,0) scale(1); }
      25% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; transform: translate(20px,-20px) scale(1.05); }
      50% { border-radius: 50% 60% 30% 60% / 30% 40% 70% 50%; transform: translate(-10px,15px) scale(0.95); }
      75% { border-radius: 40% 50% 60% 30% / 60% 50% 40% 60%; transform: translate(15px,10px) scale(1.02); }
    }
    @keyframes cell-float {
      0%, 100% { transform: translate(0,0) scale(1); opacity: 0.4; }
      25% { transform: translate(30px,-40px) scale(1.1); opacity: 0.6; }
      50% { transform: translate(-20px,-60px) scale(0.9); opacity: 0.3; }
      75% { transform: translate(40px,-20px) scale(1.05); opacity: 0.5; }
    }

    .animate-fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-scale-in { animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-float-slow { animation: floatSlow 8s ease-in-out infinite; }
    .animate-marquee { animation: marquee 30s linear infinite; }
    .animate-rotate-slow { animation: rotate-slow 20s linear infinite; }
    .animate-wavy { animation: wavy-rotate 25s linear infinite; }
    .animate-blob { animation: blob-move 15s ease-in-out infinite; }
    .animate-cell { animation: cell-float 12s ease-in-out infinite; }

    .magnetic-btn {

      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .magnetic-btn::after {
      content: '';
      position: absolute; inset: -2px;
      border-radius: inherit;
      background: linear-gradient(135deg, #d4789a, #e8a4bf, #d4789a);
      background-size: 200% 200%;
      animation: gradient-shift 3s ease infinite;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .magnetic-btn:hover::after { opacity: 1; }
    .magnetic-btn:hover { transform: translateY(-3px); }

    .glass-card {
      background: rgba(36, 26, 32, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(51, 37, 45, 0.8);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(212, 120, 154, 0.3);
      transform: translateY(-8px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 40px rgba(212,120,154,0.05);
    }

    /* Gradient text */
    .text-gradient {
      background: linear-gradient(135deg, #f0f0f0 0%, #d4789a 40%, #e8a4bf 70%, #f0c4d0 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 4s ease infinite;
    }
    .text-gradient-gold {
      background: linear-gradient(135deg, #f0c4d0 0%, #e8a4bf 50%, #f0c4d0 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Project card */
    .project-card {
      position: relative;
      overflow: hidden;
      border: 1px solid #33252d;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .project-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 30%, rgba(14,17,23,0.9) 100%);
      z-index: 1;
      transition: opacity 0.5s;
    }
    .project-card:hover::before {
      background: linear-gradient(180deg, transparent 0%, rgba(14,17,23,0.95) 100%);
    }
    .project-card:hover {
      border-color: rgba(212, 120, 154, 0.4);
      transform: scale(1.01);
    }
    .project-card img {
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .project-card:hover img {
      transform: scale(1.08);

      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .project-card:hover .project-info {
      transform: translateY(0);
      opacity: 1;
    }

    .nav-link {

    .nav-link::after {

      width: 0; height: 1px;
      background: #d4789a;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);

    .input-field {

      color: #f0f0f0;

    /* Timeline */
    .timeline-dot {

      background: #d4789a;
      border-radius: 50%;
      border: 3px solid #1a1218;
      box-shadow: 0 0 0 2px #d4789a;
      position: relative;

      width: 2px; height: calc(100% - 20px);
      background: linear-gradient(180deg, #d4789a, transparent);

    /* Admin sidebar */

      background: #241a20;
      border: 1px solid #d4789a;
      border-radius: 12px;
      color: #e8a4bf;

      transition: all 0.4s ease;

    .mobile-menu { transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .mobile-menu.open { transform: translateX(0); }

    .section-divider {

      background: linear-gradient(90deg, transparent, #33252d, transparent);

    .tag {

      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.1);

    .big-number:hover {

      color: rgba(212,120,154,0.1);

      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 20px;

    .horizontal-scroll::-webkit-scrollbar-thumb { background: #3d2a35; border-radius: 2px; }
    .horizontal-scroll > * { scroll-snap-align: start; flex-shrink: 0; }

    /* Wavy circle for avatar */
    .wavy-circle {
      position: relative;
      width: 320px;
      height: 320px;
    }
    .wavy-circle .avatar-inner {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      overflow: hidden;
      background: #241a20;
      z-index: 2;
    }
    /* Thin organic wavy ring that rotates slowly */
    .wavy-ring {
      position: absolute;
      inset: -8px;
      border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%;
      border: 1.5px solid rgba(212, 120, 154, 0.35);
      animation: wavy-rotate 25s linear infinite;
      z-index: 1;
    }
    .wavy-ring::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 45% 55% 40% 60% / 55% 45% 55% 45%;
      border: 1px solid rgba(212, 120, 154, 0.2);
      animation: wavy-rotate 30s linear infinite reverse;
    }

    /* DNA Helix decoration */
    .dna-helix {
      position: fixed;
      right: -60px;
      top: 50%;
      transform: translateY(-50%);
      width: 120px;
      height: 600px;
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
    }

    /* Floating cells */
    .floating-cell {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.12;
    }
    .cell-1 { width: 40px; height: 40px; background: radial-gradient(circle, #d4789a 0%, transparent 70%); top: 20%; left: 10%; animation: cell-float 14s ease-in-out infinite; }
    .cell-2 { width: 25px; height: 25px; background: radial-gradient(circle, #c07090 0%, transparent 70%); top: 60%; left: 85%; animation: cell-float 16s ease-in-out infinite 2s; }
    .cell-3 { width: 35px; height: 35px; background: radial-gradient(circle, #b06080 0%, transparent 70%); top: 80%; left: 15%; animation: cell-float 18s ease-in-out infinite 4s; }
    .cell-4 { width: 20px; height: 20px; background: radial-gradient(circle, #d080a0 0%, transparent 70%); top: 30%; left: 90%; animation: cell-float 12s ease-in-out infinite 1s; }
    .cell-5 { width: 30px; height: 30px; background: radial-gradient(circle, #c07090 0%, transparent 70%); top: 50%; left: 5%; animation: cell-float 15s ease-in-out infinite 3s; }

    /* Organic blobs */
    .blob {
      position: fixed;
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;

  </style>

      set: (data) => { try { localStorage.setItem('biology_portfolio_data', JSON.stringify(data)); return true; } catch(e) { return false; } },
      export: () => { const data = Storage.get(); const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'biology-portfolio-backup.json'; a.click(); URL.revokeObjectURL(url); },
      import: (file) => new Promise((resolve,reject) => { const reader = new FileReader(); reader.onload = (e) => { try { const data = JSON.parse(e.target.result); Storage.set(data); resolve(data); } catch(err) { reject(err); } }; reader.readAsText(file); }),

      initFirebase: () => {
        if (firebaseReady) return true;
        try {
          firebaseApp = firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
          firebaseReady = true;
          return true;
        } catch(e) { return false; }
      },

      syncToCloud: async (data) => {
        if (!Storage.initFirebase()) return false;
        try {
          await db.collection('portfolio').doc('biology-portfolio').set(data);
          return true;
        } catch(e) { return false; }
      },

      fetchFromCloud: async () => {
        if (!Storage.initFirebase()) return null;
        try {
          const doc = await db.collection('portfolio').doc('biology-portfolio').get();
          if (doc.exists) { Storage.set(doc.data()); return doc.data(); }
          return null;
        } catch(e) { return null; }
      }
    };

    const DataContext = createContext();
    function DataProvider({ children }) {
      const [data, setData] = useState(Storage.get());
      const [toast, setToast] = useState(null);
      const [syncing, setSyncing] = useState(false);
      const [cloudStatus, setCloudStatus] = useState('local');

      useEffect(() => {
        const load = async () => {
          setSyncing(true);
          const cloudData = await Storage.fetchFromCloud();
          if (cloudData) {
            setData(cloudData);
            setCloudStatus('connected');
            showToast('Data loaded from cloud');
          } else {
            const localData = Storage.get();
            if (localData !== defaultData) {
              await Storage.syncToCloud(localData);
            }
            setCloudStatus('connected');
          }
          setSyncing(false);
        };
        load();
      }, []);

      const updateData = async (newData) => { 
        setData(newData); 
        Storage.set(newData); 
        setSyncing(true);
        const ok = await Storage.syncToCloud(newData);
        setSyncing(false);
        if (ok) {
          setCloudStatus('connected');
          showToast('Saved & synced to cloud!');
        } else {
          setCloudStatus('error');
          showToast('Saved locally (cloud sync failed)');
        }
      };

      const updateSection = (section, value) => updateData({ ...data, [section]: value });
      const showToast = (message) => { setToast(message); setTimeout(() => setToast(null), 3000); };

      const manualSync = async () => {
        setSyncing(true);
        const ok = await Storage.syncToCloud(data);
        setSyncing(false);
        if (ok) {
          setCloudStatus('connected');
          showToast('Synced to cloud!');
        } else {
          setCloudStatus('error');
          showToast('Sync failed');
        }
      };

      return (
        <DataContext.Provider value={{ data, updateData, updateSection, showToast, syncing, cloudStatus, manualSync }}>
          {children}
          <div className={`toast ${toast ? 'show' : ''}`}>
            <div className="flex items-center gap-2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 6L9 17l-5-5"/></svg>
              {toast}
              {syncing && <span className="ml-2 text-xs animate-pulse">Syncing...</span>}
            </div>
          </div>
        </DataContext.Provider>
      );
    }
    function useData() { return useContext(DataContext); }

    function useHashRouter() {
      const [path, setPath] = useState(window.location.hash.slice(1) || '/');
      useEffect(() => { const h = () => setPath(window.location.hash.slice(1) || '/'); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
      const navigate = (to) => { window.location.hash = to; window.scrollTo(0,0); };
      return { path, navigate };
    }

    function useScrollReveal() {
      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
            }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, []);
    }

              </div>
            ))}
            {education.length === 0 && <p className="text-muted text-center py-8">No education entries yet.</p>}
          </div>

          {education.length > 0 && (
            <button onClick={handleSave} className="mt-6 magnetic-btn px-8 py-4 rounded-xl bg-primary text-dark font-bold flex items-center gap-2">
              <Icon name="save" size={18} /> Save All Changes
            </button>
          )}
        </div>
      );
    }

    function AdminSkills() {
      const { data, updateSection } = useData();
      const [skills, setSkills] = useState(data.skills);
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({ name: '', category: 'technical', level: 80 });

      const handleSave = () => updateSection('skills', skills);

      const handleAdd = () => {
        const newSkill = { id: Date.now().toString(), ...form };
        setSkills([...skills, newSkill]);
        setForm({ name: '', category: 'technical', level: 80 });
      };

      const handleUpdate = () => {
        setSkills(skills.map(s => s.id === editing ? { ...s, ...form } : s));
        setEditing(null);
        setForm({ name: '', category: 'technical', level: 80 });
      };

      const handleDelete = (id) => {
        if (confirm('Delete this skill?')) setSkills(skills.filter(s => s.id !== id));
      };

      const startEdit = (s) => {
        setEditing(s.id);
        setForm({ name: s.name, category: s.category, level: s.level });
      };

      const categories = { technical: 'Technical', tool: 'Tools', soft: 'Soft Skills' };

      return (
        <div>
          <h2 className="text-3xl font-black mb-2">Skills</h2>
          <p className="text-muted mb-10">Manage your skills and proficiency levels.</p>

          <div className="glass-card rounded-xl p-6 mb-8">
            <h3 className="text-lg font-bold mb-6">{editing ? 'Edit Skill' : 'Add Skill'}</h3>
            <div className="grid md:grid-cols-3 gap-4 mb-4">
              <input value={form.name} onChange={e => setForm({...form, name: e.target.value})} 
                     className="input-field px-4 py-3 rounded-xl" placeholder="Skill Name" />
              <select value={form.category} onChange={e => setForm({...form, category: e.target.value})} 
                      className="input-field px-4 py-3 rounded-xl">
                <option value="technical">Technical</option>
                <option value="tool">Tool</option>
                <option value="soft">Soft Skill</option>
              </select>
              <div className="flex items-center gap-3">
                <input type="range" min="0" max="100" value={form.level} onChange={e => setForm({...form, level: parseInt(e.target.value)})} 
                       className="flex-1 accent-primary" />
                <span className="text-sm font-mono w-10">{form.level}%</span>
              </div>
            </div>
            <div className="flex gap-3">
              {editing ? (
                <>
                  <button onClick={handleUpdate} className="magnetic-btn px-6 py-3 rounded-lg bg-primary text-dark font-bold text-sm">Update</button>
                  <button onClick={() => { setEditing(null); setForm({ name: '', category: 'technical', level: 80 }); }} 
                          className="px-6 py-3 rounded-lg border border-border text-muted hover:border-primary text-sm transition-colors">Cancel</button>
                </>
              ) : (
                <button onClick={handleAdd} className="magnetic-btn px-6 py-3 rounded-lg bg-primary text-dark font-bold text-sm flex items-center gap-2">
                  <Icon name="plus" size={16} /> Add Skill
                </button>
              )}
            </div>
          </div>

          {Object.entries(categories).map(([cat, label]) => {
            const catSkills = skills.filter(s => s.category === cat);
            if (catSkills.length === 0) return null;
            return (
              <div key={cat} className="mb-8">
                <h3 className="text-sm font-bold text-muted uppercase tracking-wider mb-4">{label}</h3>
                <div className="space-y-3">
                  {catSkills.map(s => (
                    <div key={s.id} className="glass-card rounded-xl p-5">
                      <div className="flex items-center justify-between mb-3">
                        <span className="font-medium">{s.name}</span>
                        <div className="flex items-center gap-2">
                          <span className="text-sm text-muted font-mono">{s.level}%</span>
                          <button onClick={() => startEdit(s)} className="p-1.5 rounded hover:bg-surface transition-colors">
                            <Icon name="edit" size={14} className="text-muted" />
                          </button>
                          <button onClick={() => handleDelete(s.id)} className="p-1.5 rounded hover:bg-surface transition-colors">
                            <Icon name="trash" size={14} className="text-muted" />
                          </button>
                        </div>
                      </div>
                      <div className="skill-bar"><div className="skill-bar-fill" style={{width: `${s.level}%`}} /></div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}

          {skills.length === 0 && <p className="text-muted text-center py-8">No skills added yet.</p>}

          {skills.length > 0 && (
            <button onClick={handleSave} className="mt-6 magnetic-btn px-8 py-4 rounded-xl bg-primary text-dark font-bold flex items-center gap-2">
              <Icon name="save" size={18} /> Save All Changes
            </button>
          )}
        </div>
      );
    }

    function AdminCVSettings() {
      const { data, updateSection } = useData();
      const [stats, setStats] = useState(data.stats || defaultData.stats);

      const handleSave = () => updateSection('stats', stats);

      return (
        <div>
          <h2 className="text-3xl font-black mb-2">CV & Stats Settings</h2>
          <p className="text-muted mb-10">Customize your homepage stats and CV display.</p>

          <div className="glass-card rounded-xl p-6 mb-6">
            <h3 className="text-lg font-bold mb-6">Homepage Stats (Editable)</h3>
            <p className="text-muted text-sm mb-6">These values appear on the homepage stats section. You can set them manually or they will auto-update based on your data.</p>
            <div className="grid md:grid-cols-2 gap-4">
              <div>
                <label className="block text-sm text-muted mb-2">Years Experience</label>
                <input value={stats.years} onChange={e => setStats({...stats, years: e.target.value})} 
                       className="input-field w-full px-4 py-3 rounded-xl" placeholder="e.g. 2+" />
              </div>
              <div>
                <label className="block text-sm text-muted mb-2">Projects Done</label>
                <input value={stats.projects} onChange={e => setStats({...stats, projects: e.target.value})} 
                       className="input-field w-full px-4 py-3 rounded-xl" placeholder="e.g. 15+" />
              </div>
              <div>
                <label className="block text-sm text-muted mb-2">Samples Analyzed</label>
                <input value={stats.samples} onChange={e => setStats({...stats, samples: e.target.value})} 
                       className="input-field w-full px-4 py-3 rounded-xl" placeholder="e.g. 200+" />
              </div>
              <div>
                <label className="block text-sm text-muted mb-2">Coffee Cups</label>
                <input value={stats.coffee} onChange={e => setStats({...stats, coffee: e.target.value})} 
                       className="input-field w-full px-4 py-3 rounded-xl" placeholder="e.g. ∞" />
              </div>
            </div>
          </div>

          <div className="glass-card rounded-xl p-6 mb-6">
            <h3 className="text-lg font-bold mb-4">CV Page Options</h3>
            <p className="text-muted text-sm mb-6">The CV page automatically pulls data from your Profile, Experience, Education, Skills, and Projects.</p>
            <div className="space-y-3">
              <label className="flex items-center gap-3 p-4 rounded-xl bg-surface/50 cursor-pointer">
                <input type="checkbox" defaultChecked className="w-4 h-4 accent-primary" />
                <span className="text-sm">Show projects section in CV</span>
              </label>
              <label className="flex items-center gap-3 p-4 rounded-xl bg-surface/50 cursor-pointer">
                <input type="checkbox" defaultChecked className="w-4 h-4 accent-primary" />
                <span className="text-sm">Show skill percentages</span>
              </label>
              <label className="flex items-center gap-3 p-4 rounded-xl bg-surface/50 cursor-pointer">
                <input type="checkbox" defaultChecked className="w-4 h-4 accent-primary" />
                <span className="text-sm">Show social links in CV header</span>
              </label>
            </div>
          </div>

          <div className="glass-card rounded-xl p-6">
            <h3 className="text-lg font-bold mb-4">Print Styles</h3>
            <p className="text-muted text-sm mb-6">When you print the CV page (Ctrl+P or Cmd+P), it will use a clean, optimized layout.</p>
            <button onClick={() => window.open('#/cv', '_blank')} className="magnetic-btn px-6 py-3 rounded-lg bg-primary text-dark font-bold text-sm flex items-center gap-2">
              <Icon name="eye" size={16} /> Preview CV Page
            </button>
          </div>

          <button onClick={handleSave} className="mt-6 magnetic-btn px-8 py-4 rounded-xl bg-primary text-dark font-bold flex items-center gap-2">
            <Icon name="save" size={18} /> Save Stats
          </button>
        </div>
      );
    }

    function AdminSiteSettings() {
      const { data, updateSection, cloudStatus, syncing } = useData();
      const [settings, setSettings] = useState(data.settings);

      const handleSave = () => updateSection('settings', settings);

      return (
        <div>
          <h2 className="text-3xl font-black mb-2">Site Settings</h2>
          <p className="text-muted mb-10">Customize colors, SEO, Firebase, and other site-wide settings.</p>

          <div className="glass-card rounded-xl p-6 mb-6">
            <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
              <Icon name="globe" size={20} className="text-primary" /> Firebase Database
            </h3>
            <div className="flex items-center gap-3 mb-4">
              <span className={`w-2.5 h-2.5 rounded-full ${cloudStatus === 'connected' ? 'bg-primary animate-pulse' : cloudStatus === 'error' ? 'bg-red-500' : 'bg-yellow-500'}`} />
              <span className="text-sm">
                {cloudStatus === 'connected' ? 'Connected to Firebase' : cloudStatus === 'error' ? 'Connection error' : 'Checking...'}
              </span>
              {syncing && <span className="text-xs text-muted animate-pulse ml-2">Syncing...</span>}
            </div>
            <div className="grid md:grid-cols-2 gap-3 mb-4">
              <div className="p-3 rounded-lg bg-surface/50 border border-border">
                <span className="text-xs text-muted block mb-1">Project ID</span>
                <span className="text-sm font-mono">zizd-11eff</span>
              </div>
              <div className="p-3 rounded-lg bg-surface/50 border border-border">
                <span className="text-xs text-muted block mb-1">Doc Path</span>
                <span className="text-sm font-mono">biology-portfolio</span>
              </div>
            </div>
            <p className="text-muted text-xs">Firebase is configured. All changes are automatically synced to the cloud under the biology-portfolio document.</p>
          </div>

          <div className="glass-card rounded-xl p-6 mb-6">
            <h3 className="text-lg font-bold mb-6">Theme Colors</h3>
            <div className="grid md:grid-cols-2 gap-4">
              <div>
                <label className="block text-sm text-muted mb-2">Primary Color</label>
                <div className="flex gap-3">
                  <input type="color" value={settings.theme.primary} 
                         onChange={e => setSettings({...settings, theme: {...settings.theme, primary: e.target.value}})} 
                         className="w-12 h-12 rounded-lg cursor-pointer border-0" />
                  <input value={settings.theme.primary} 
                         onChange={e => setSettings({...settings, theme: {...settings.theme, primary: e.target.value}})} 
                         className="input-field flex-1 px-4 py-3 rounded-xl font-mono text-sm" />
                </div>
              </div>
              <div>
                <label className="block text-sm text-muted mb-2">Accent Color</label>
                <div className="flex gap-3">
                  <input type="color" value={settings.theme.accent} 
                         onChange={e => setSettings({...settings, theme: {...settings.theme, accent: e.target.value}})} 
                         className="w-12 h-12 rounded-lg cursor-pointer border-0" />
                  <input value={settings.theme.accent} 
                         onChange={e => setSettings({...settings, theme: {...settings.theme, accent: e.target.value}})} 
                         className="input-field flex-1 px-4 py-3 rounded-xl font-mono text-sm" />
                </div>
              </div>
            </div>
            <p className="text-muted text-xs mt-4">Note: Color changes require a page refresh to take full effect.</p>
          </div>

          <div className="glass-card rounded-xl p-6 mb-6">
            <h3 className="text-lg font-bold mb-6">SEO & Meta</h3>
            <div className="space-y-4">
              <div>
                <label className="block text-sm text-muted mb-2">Page Title</label>
                <input value={settings.site.metaTitle} 
                       onChange={e => setSettings({...settings, site: {...settings.site, metaTitle: e.target.value}})} 
                       className="input-field w-full px-4 py-3 rounded-xl" />
              </div>
              <div>
                <label className="block text-sm text-muted mb-2">Meta Description</label>
                <textarea value={settings.site.metaDescription} 
                          onChange={e => setSettings({...settings, site: {...settings.site, metaDescription: e.target.value}})} 
                          rows={3} className="input-field w-full px-4 py-3 rounded-xl resize-none" />
              </div>
            </div>
          </div>

          <div className="glass-card rounded-xl p-6 mb-6">
            <h3 className="text-lg font-bold mb-4">Admin Password</h3>
            <p className="text-muted text-sm mb-4">Current: <span className="font-mono text-primary">admin123</span></p>
            <div className="flex gap-3">
              <input type="password" className="input-field flex-1 px-4 py-3 rounded-xl" placeholder="New password" disabled />
              <button className="px-4 py-3 rounded-lg bg-surface border border-border text-muted text-sm" disabled>Coming Soon</button>
            </div>
          </div>

          <button onClick={handleSave} className="magnetic-btn px-8 py-4 rounded-xl bg-primary text-dark font-bold flex items-center gap-2">
            <Icon name="save" size={18} /> Save Settings
          </button>
        </div>
      );
    }

    function App() {
      const { path, navigate } = useHashRouter();
      const [adminAuth, setAdminAuth] = useState(false);

      useEffect(() => {
        setAdminAuth(localStorage.getItem('admin_auth') === 'true');
      }, []);

      const isAdmin = path.startsWith('/admin');

      if (isAdmin && !adminAuth) {
        return <AdminLogin onLogin={() => setAdminAuth(true)} />;
      }

      if (isAdmin) {
        const adminTab = path.split('/')[2] || 'dashboard';
        return (
          <DataProvider>
            <AdminLayout activeTab={adminTab}>
              {adminTab === 'dashboard' && <AdminDashboard />}
              {adminTab === 'profile' && <AdminProfile />}
              {adminTab === 'projects' && <AdminProjects />}
              {adminTab === 'experience' && <AdminExperience />}
              {adminTab === 'education' && <AdminEducation />}
              {adminTab === 'skills' && <AdminSkills />}
              {adminTab === 'cv' && <AdminCVSettings />}
              {adminTab === 'settings' && <AdminSiteSettings />}
            </AdminLayout>
          </DataProvider>
        );
      }

      return (
        <DataProvider>
          <div className="min-h-screen flex flex-col">
            <Navbar />
            <main className="flex-1">
              {path === '/' && <Home />}
              {path === '/work' && <Work />}
              {path.startsWith('/project/') && <ProjectDetail id={path.split('/')[2]} />}
              {path === '/about' && <About />}
              {path === '/cv' && <CV />}
              {path === '/contact' && <Contact />}
            </main>
            <Footer />
          </div>
        </DataProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
